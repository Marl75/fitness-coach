<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Routine</title>
<meta name="description" content="Routine — note tes séances de sport et suis ta régularité.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png?v=6">
<link rel="apple-touch-icon" href="icon-180.png?v=6">
<meta name="theme-color" content="#0F1115">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="css/styles.css?v=6">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 24 24"><g fill="currentColor"><rect x="1.5" y="9" width="3" height="6" rx="1"/><rect x="4.5" y="6" width="3.5" height="12" rx="1.2"/><rect x="8" y="10.75" width="8" height="2.5"/><rect x="16" y="6" width="3.5" height="12" rx="1.2"/><rect x="19.5" y="9" width="3" height="6" rx="1"/></g></symbol>
  <symbol id="i-today" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></g></symbol>
  <symbol id="i-track" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4"/><circle cx="8.5" cy="14" r="1" fill="currentColor"/><circle cx="12" cy="14" r="1" fill="currentColor"/><circle cx="15.5" cy="17" r="1" fill="currentColor"/></g></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></g></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4"/></g></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2.5h6"/></g></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-eyeoff" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A9.8 9.8 0 0 1 12 5c5 0 9 4.5 10 7-.4 1-1.3 2.4-2.6 3.7M6.6 6.6C4.6 7.9 3.1 9.9 2 12c1 2.5 5 7 10 7 1.9 0 3.6-.6 5-1.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></g></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
</svg>

<!-- Écran de connexion -->
<div class="auth-screen hidden" id="auth-screen">
  <div class="auth-card">
    <div class="brand">
      <span class="brand-mark"><svg><use href="#i-logo"/></svg></span>
      <span class="brand-name">Routine</span>
    </div>
    <p class="auth-sub" data-i18n="authSub">Note tes séances, suis ta régularité</p>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchAuth('login')" data-i18n="tabLogin">Connexion</button>
      <button class="auth-tab" id="tab-register" onclick="switchAuth('register')" data-i18n="tabRegister">Inscription</button>
    </div>
    <div class="auth-msg hidden" id="auth-msg"></div>
    <form onsubmit="submitAuth(event)">
      <label class="field"><span data-i18n="email">E-mail</span>
        <input class="input" type="email" id="auth-email" autocomplete="email" placeholder="ton@email.com" data-i18n-ph="emailPh" required>
      </label>
      <label class="field"><span data-i18n="password">Mot de passe</span>
        <input class="input" type="password" id="auth-password" autocomplete="current-password" placeholder="6 caractères minimum" data-i18n-ph="passwordPh" required>
      </label>
      <button class="btn-big" id="auth-submit" type="submit" data-i18n="login">Se connecter</button>
    </form>
    <button class="link" id="auth-forgot" onclick="forgotPassword()" style="display:block;margin:10px auto 0" data-i18n="forgot">Mot de passe oublié ?</button>
    <div class="lang-row" id="auth-lang"></div>
    <p class="demo-note hidden" id="demo-note" data-i18n="demoAuth">Mode démo : n’importe quel e-mail et mot de passe fonctionnent. Les séances sont factices et restent sur cet appareil.</p>
  </div>
</div>

<!-- Appli -->
<div class="app hidden" id="app">
  <header class="top">
    <div class="brand">
      <span class="brand-mark"><svg><use href="#i-logo"/></svg></span>
      <span class="brand-name">Routine</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="sync hidden" id="sync" data-i18n="offline">Hors ligne · gardé sur le téléphone</span>
      <button class="icon-btn" onclick="openMenu()" aria-label="Mon compte" data-i18n-aria="account"><svg><use href="#i-user"/></svg></button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="nav hidden" id="nav">
  <div class="nav-inner">
    <button class="nav-btn" data-tab="today" onclick="setTab('today')"><svg><use href="#i-today"/></svg><span data-i18n="navToday">Séance</span></button>
    <button class="nav-btn" data-tab="track" onclick="setTab('track')"><svg><use href="#i-track"/></svg><span data-i18n="navTrack">Suivi</span></button>
  </div>
</nav>

<div class="backdrop hidden" id="backdrop" onclick="closeSheet()"></div>
<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true"></div>

<script src="js/config.js?v=6"></script>
<script src="js/i18n.js?v=6"></script>
<script src="js/exercises.js?v=6"></script>
<script src="js/util.js?v=6"></script>
<script src="js/data.js?v=6"></script>
<script src="js/charts.js?v=6"></script>
<script src="js/app.js?v=6"></script>
</body>
</html>
